<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Camisas Enchei-vos 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
/* Painel interno: faixa vinho com a logo; números-chave no topo; gráficos de barras finas; tabelas de grade e pedidos. Visual claro, igual ao site. */
:root{
  --bg:#fbf7f5;--surface:#fff;--soft:#f5ede9;--line:#eadcd5;--ink:#2b1411;--muted:#7c645c;--dim:#a8928a;
  --band:#3a0a06;--flame:#c4301c;--pago:#9c2a17;--res:#e0884a;--track:#f1e6e1;
  --ok:#3f8a57;--warn:#b26b12;--info:#2f6fa8;
  --f:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
b,strong{font-weight:500}button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.band{background:var(--band);color:#fff;padding:12px 20px calc(12px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.band img{height:34px;width:auto}
.band h1{font-size:18px;font-weight:400;margin:0;flex:1;min-width:180px;letter-spacing:.02em}
.band .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.band small{color:#e6c9c2;font-size:13px}
.bt{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 60px;display:grid;gap:26px}
h2{font-weight:400;font-size:22px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.note{font-size:14px;color:var(--muted)}
/* login */
.login{max-width:380px;margin:70px auto;display:grid;gap:14px;padding-inline:20px}
.login input{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;background:var(--surface)}
.btn{border:0;border-radius:999px;background:var(--flame);color:#fff;padding:13px 22px;font-size:17px;cursor:pointer}
.err{color:var(--flame);font-size:15px;margin:0}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:32px;font-weight:300;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.kpi.hl{border-color:var(--pago)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
/* barras por modelo */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;padding-block:8px}
.mrow .nm{font-size:15px}
.track{height:14px;background:var(--track);border-radius:4px;display:flex;gap:2px;overflow:hidden}
.track span{height:100%;display:block}
.track .p{background:var(--pago);border-radius:4px 0 0 4px}.track .r{background:var(--res)}
.mrow .val{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .val b{color:var(--ink)}
@media(max-width:560px){.mrow{grid-template-columns:1fr;gap:4px}}
/* barras por dia */
.days{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.day{flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.day .bar{width:100%;max-width:38px;background:var(--pago);border-radius:4px 4px 0 0;min-height:2px}
.day .n{font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.dlab{display:flex;gap:10px;overflow-x:auto}.dlab span{flex:1;min-width:36px;text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.formas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.forma{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.forma small{display:block;font-size:13px;color:var(--muted)}.forma b{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
/* grade */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.grade{min-width:700px;font-size:14px}
.grade th,.grade td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.grade th{font-weight:400;color:var(--muted);font-size:13px}
.grade td:first-child,.grade th:first-child{text-align:left;white-space:nowrap}
.grade td.na{background:var(--soft)}
.grade td .s{display:block;font-size:11px;color:var(--muted)}
.grade td.esg{background:#f6d3cc;color:#7a1c0e;font-weight:500}
.grade .ln{display:block;font-size:12px;color:var(--muted)}
/* pedidos */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface)}
.peds{min-width:760px;font-size:14px}
.peds th,.peds td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.peds th{font-weight:400;color:var(--muted);font-size:13px}
.peds td.num{text-align:right;white-space:nowrap}
.peds a{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;border:1px solid;white-space:nowrap}
.st-Aguardando{color:var(--warn)}.st-Pago{color:var(--ok)}.st-Entregue{color:var(--muted)}.st-Expirado,.st-Cancelado{color:var(--dim)}
.st-Comprovante{color:var(--info)}.st-Analise{color:var(--warn)}
.sep{columns:2 320px;column-gap:24px}
.sep div{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sep small{color:var(--muted)}
@media print{.band .act,.filters,#sec-graf,#sec-grade,#sec-peds,.kpis{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>

    if(!j.ok){sairTela(j.erro==="bloqueado"?"Muitas tentativas. Aguarde 10 minutos.":"Senha incorreta.");return;}
    D=j;$("login").hidden=true;$("app").hidden=false;$("acts").hidden=false;render();
    $("upd").textContent="Atualizado às "+new Date(j.agora).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }).catch(()=>{$("upd").textContent="Sem conexão. Tentando de novo...";});
}
function sairTela(msg){$("app").hidden=true;$("acts").hidden=true;$("login").hidden=false;$("lbtn").disabled=false;$("lbtn").textContent="Entrar";
  if(msg){$("lerr").textContent=msg;$("lerr").hidden=false;}try{sessionStorage.removeItem("painel_senha");}catch(e){}senha=null;}
$("lf").onsubmit=e=>{e.preventDefault();senha=$("senha").value;$("lerr").hidden=true;$("lbtn").disabled=true;$("lbtn").textContent="Entrando...";
  try{sessionStorage.setItem("painel_senha",senha);}catch(e){}carregar();};
$("sair").onclick=()=>sairTela();$("refresh").onclick=()=>carregar();$("print").onclick=()=>window.print();
setInterval(()=>{if(senha&&!$("app").hidden)carregar();},60000);
if(senha)carregar();

function render(){
  const P=D.pedidos,G=D.grade;
  const pagos=P.filter(p=>PAGO.includes(p.status)),res=P.filter(p=>RES.includes(p.status));
  const sum=(a,f)=>a.reduce((x,p)=>x+f(p),0);
  const prod=sum(G,l=>l.prod),vPago=sum(G,l=>l.pago),vRes=sum(G,l=>l.reservado);
  const r=new Date(D.fim)-new Date(D.agora),d=Math.floor(r/864e5),h=Math.floor(r%864e5/36e5);
  $("kpis").innerHTML=`
   <div class="kpi hl"><small>Camisas pagas</small><b>${vPago}</b><span>${pagos.length} pedido${pagos.length===1?"":"s"}</span></div>
   <div class="kpi hl"><small>Arrecadado</small><b>${brl(sum(pagos,p=>p.valor))}</b><span>pagos e entregues</span></div>
   <div class="kpi"><small>Aguardando pagamento</small><b>${vRes}</b><span>${brl(sum(res,p=>p.valor))} em ${res.length} pedido${res.length===1?"":"s"}</span></div>
   <div class="kpi"><small>Disponíveis</small><b>${prod-vPago-vRes}</b><span>de ${prod} produzidas</span></div>
   <div class="kpi"><small>Fim da pré-venda</small><b>${r>0?(d>0?d+"d "+h+"h":h+"h"):"Encerrada"}</b><span>14/10 às 23h59</span></div>`;
  // por modelo
  const mods={};G.forEach(l=>{const m=mods[l.modelo]=mods[l.modelo]||{prod:0,pago:0,res:0};m.prod+=l.prod;m.pago+=l.pago;m.res+=l.reservado;});
  $("modelos").innerHTML=Object.entries(mods).map(([n,m])=>`<div class="mrow" title="${n}: ${m.pago} pagas, ${m.res} reservadas, ${m.prod-m.pago-m.res} disponíveis de ${m.prod}">
    <span class="nm">${n.replace("Camisa ","")}</span>
    <div class="track"><span class="p" style="width:${m.pago/m.prod*100}%"></span><span class="r" style="width:${m.res/m.prod*100}%"></span></div>
    <span class="val"><b>${m.pago}</b> + ${m.res} de ${m.prod}</span></div>`).join("");
  // por dia (peças pagas)
  const dias={};pagos.forEach(p=>{const k=new Date(p.data).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});dias[k]=(dias[k]||0)+p.pecas;});
  const ks=Object.keys(dias);const mx=Math.max(1,...Object.values(dias));
  $("dias").innerHTML=ks.length?`<div class="days">${ks.map(k=>`<div class="day" title="${k}: ${dias[k]} camisas pagas"><span class="n">${dias[k]}</span><div class="bar" style="height:${dias[k]/mx*100}%"></div></div>`).join("")}</div><div class="dlab">${ks.map(k=>`<span>${k}</span>`).join("")}</div>`
    :`<p class="note">Nenhuma camisa paga ainda. As barras aparecem conforme os pagamentos são confirmados.</p>`;
  const fm={};pagos.forEach(p=>{const f=p.forma||"Não informado";fm[f]=fm[f]||{n:0,v:0};fm[f].n++;fm[f].v+=p.valor;});
  $("formas").innerHTML=Object.keys(fm).length?Object.entries(fm).map(([f,x])=>`<div class="forma"><small>${f}</small><b>${x.n}</b> <span class="note">${brl(x.v)}</span></div>`).join(""):"";
  // grade
  const linhas={};G.forEach(l=>{const id=l.k.split("|")[0];(linhas[id]=linhas[id]||{nome:l.modelo,linha:l.linha,cor:l.cor,t:{}}).t[l.tam]=l;});
  $("grade").innerHTML=`<tr><th>Modelo · linha</th>${SIZES.map(s=>`<th>${s}</th>`).join("")}<th>Total</th></tr>`+Object.values(linhas).map(L=>{
    let tp=0,tv=0;const cells=SIZES.map(s=>{const c=L.t[s];if(!c)return`<td class="na"></td>`;const v=c.pago+c.reservado;tp+=c.prod;tv+=v;
      return `<td class="${v>=c.prod?"esg":""}" title="${s}: ${c.pago} pagas, ${c.reservado} reservadas, ${c.prod} produzidas">${v}<span class="s">de ${c.prod}</span></td>`;}).join("");
    return `<tr><td>${L.nome.replace("Camisa ","")}<span class="ln">${L.linha} · ${L.cor}</span></td>${cells}<td><b>${tv}</b><span class="s">de ${tp}</span></td></tr>`;}).join("");
  // filtros
  const F=[["ativos","Ativos"],["Aguardando","Aguardando"],["Em análise (PagBank)","Em análise"],["Comprovante recebido","Comprovante"],["Pago","Pagos"],["Entregue","Entregues"],["inativos","Expirados/cancelados"],["todos","Todos"]];
  const cnt=k=>k==="todos"?P.length:k==="ativos"?P.filter(p=>!["Expirado","Cancelado"].includes(p.status)).length:k==="inativos"?P.filter(p=>["Expirado","Cancelado"].includes(p.status)).length:P.filter(p=>p.status===k).length;
  $("filtros").innerHTML=F.map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${filtro===k}">${t} (${cnt(k)})</button>`).join("")+`<input class="search" id="busca" placeholder="Buscar nome, WhatsApp ou nº" value="${busca.replace(/"/g,"&quot;")}">`;
  $("filtros").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render();});
  $("busca").oninput=e=>{busca=e.target.value;renderPeds();const el=$("busca");};
  renderPeds();
  // separação
  $("sep").innerHTML=pagos.length?pagos.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<div><b>${p.nome}</b> · nº ${p.id} <small>(${p.status})</small><br>${p.itens.split(" | ").join("<br>")}</div>`).join(""):`<p class="note">Os pedidos pagos aparecem aqui, em ordem alfabética, prontos para separar e entregar.</p>`;
}
function renderPeds(){
  const P=D.pedidos,q=busca.trim().toLowerCase();
  const ok=p=>filtro==="todos"||(filtro==="ativos"&&!["Expirado","Cancelado"].includes(p.status))||(filtro==="inativos"&&["Expirado","Cancelado"].includes(p.status))||p.status===filtro;
  const lst=P.filter(ok).filter(p=>!q||(p.nome+" "+p.zap+" "+p.id).toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
  const cls=s=>"st-"+(s==="Comprovante recebido"?"Comprovante":s==="Em análise (PagBank)"?"Analise":s);
  $("peds").innerHTML=`<tr><th>Nº</th><th>Data</th><th>Nome</th><th>WhatsApp</th><th>Camisas</th><th class="num">Valor</th><th>Status</th><th>Pagamento</th></tr>`+
   (lst.length?lst.map(p=>`<tr><td>${p.id}</td><td>${new Date(p.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${p.nome}</td>
    <td><a href="https://wa.me/55${p.zap}" target="_blank" rel="noopener">${p.zap}</a></td><td>${p.itens.split(" | ").join("<br>")}</td><td class="num">${brl(p.valor)}</td>
    <td><span class="pill ${cls(p.status)}">${p.status}</span></td><td>${p.forma||""}</td></tr>`).join(""):`<tr><td colspan="8" class="note">Nenhum pedido neste filtro.</td></tr>`);
}
</script>
